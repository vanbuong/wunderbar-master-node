# West manifest for the WunderBar master (MK24FN1M0VDC12) Zephyr workspace.
#
#   mkdir wb-zephyr-workspace && cd wb-zephyr-workspace
#   west init -l ../wunderbar-master-node
#   west update
#
# The folder you pass to `west init -l` must be named wunderbar-master-node
# (see self.path). `./scripts/build.sh zephyr` sets that up for you.

manifest:
  self:
    path: wunderbar-master-node

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      # Blinky only needs Kinetis HAL + CMSIS. Expand this list when adding
      # networking, MCUboot, or other Zephyr modules.
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nxp
          - picolibc
