CONFIG_GPIO=y
CONFIG_SERIAL=y
# IRQ RX ring for GS1500M UART0 — poll-only drops boot banners / ATE0 echo.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_BUILD_OUTPUT_BIN=y

CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_PRINTK=y

# Zephyr native logging (replaces wb_log on this app).
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_TIMESTAMP_USE_REALTIME=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_POSIX_C_LANG_SUPPORT_R=y
CONFIG_LOG_OUTPUT_FORMAT_DATE_TIMESTAMP=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Relayr"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="WunderBar Zephyr WiFi"

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Optional: -DCONFIG_WB_WIFI_SSID=\"...\" via EXTRA_CONF or overlay
