name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zephyr:
    name: Zephyr blinky + WiFi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: wunderbar-master-node

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: wunderbar-master-node
          toolchains: arm-zephyr-eabi
          sdk-version: "1.0.1"

      - name: Build blinky USB CDC
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_blinky \
            -d build-zephyr \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node"

      - name: Build blinky SEGGER RTT
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_blinky \
            -d build-zephyr-rtt \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node" \
               -DEXTRA_CONF_FILE=rtt.conf \
               -DEXTRA_DTC_OVERLAY_FILE=rtt.overlay

      - name: Build WiFi USB CDC
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_wifi \
            -d build-zephyr-wifi \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node"

      - name: Build WiFi SEGGER RTT
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_wifi \
            -d build-zephyr-wifi-rtt \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node" \
               -DEXTRA_CONF_FILE=rtt.conf \
               -DEXTRA_DTC_OVERLAY_FILE=rtt.overlay

      - name: Build BT host USB CDC
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_bt_host \
            -d build-zephyr-bt \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node"

      - name: Build BT host SEGGER RTT
        run: |
          west build -b wunderbar_master/mk64f12 \
            wunderbar-master-node/apps/zephyr_bt_host \
            -d build-zephyr-bt-rtt \
            -- -DBOARD_ROOT="${GITHUB_WORKSPACE}/wunderbar-master-node" \
               -DEXTRA_CONF_FILE=rtt.conf \
               -DEXTRA_DTC_OVERLAY_FILE=rtt.overlay

      - name: ztest wb_log
        run: |
          west build -b unit_testing \
            wunderbar-master-node/tests/ztest/wb_log \
            -d build-ztest \
            -t run

      - name: ztest gs1500m AT
        run: |
          west build -b unit_testing \
            wunderbar-master-node/tests/ztest/gs1500m_at \
            -d build-ztest-gs1500m \
            -t run

      - name: ztest gs1500m WiFi
        run: |
          west build -b unit_testing \
            wunderbar-master-node/tests/ztest/gs1500m_wifi \
            -d build-ztest-gs1500m-wifi \
            -t run

      - name: Upload blinky USB ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-blinky-usb
          path: |
            build-zephyr/zephyr/zephyr.elf
            build-zephyr/zephyr/zephyr.bin
            build-zephyr/zephyr/zephyr.hex

      - name: Upload blinky RTT ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-blinky-rtt
          path: |
            build-zephyr-rtt/zephyr/zephyr.elf
            build-zephyr-rtt/zephyr/zephyr.bin
            build-zephyr-rtt/zephyr/zephyr.hex

      - name: Upload WiFi USB ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-wifi-usb
          path: |
            build-zephyr-wifi/zephyr/zephyr.elf
            build-zephyr-wifi/zephyr/zephyr.bin
            build-zephyr-wifi/zephyr/zephyr.hex

      - name: Upload WiFi RTT ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-wifi-rtt
          path: |
            build-zephyr-wifi-rtt/zephyr/zephyr.elf
            build-zephyr-wifi-rtt/zephyr/zephyr.bin
            build-zephyr-wifi-rtt/zephyr/zephyr.hex

      - name: Upload BT host USB ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-bt-host-usb
          path: |
            build-zephyr-bt/zephyr/zephyr.elf
            build-zephyr-bt/zephyr/zephyr.bin
            build-zephyr-bt/zephyr/zephyr.hex

      - name: Upload BT host RTT ELF
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-bt-host-rtt
          path: |
            build-zephyr-bt-rtt/zephyr/zephyr.elf
            build-zephyr-bt-rtt/zephyr/zephyr.bin
            build-zephyr-bt-rtt/zephyr/zephyr.hex

  freertos:
    name: FreeRTOS blinky + WiFi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi gcc cmake ninja-build

      - name: Fetch MCUX SDK + FreeRTOS + TinyUSB + RTT
        run: ./scripts/fetch_mcux_sdk.sh "$PWD/.deps/mcux-sdk"

      - name: Build blinky USB CDC
        run: |
          cmake -S apps/mcux_freertos_blinky -B build-freertos -G Ninja \
            -DMCU_SDK_PATH="$PWD/.deps/mcux-sdk" \
            -DLOG_BACKEND=USB \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-freertos

      - name: Build blinky SEGGER RTT
        run: |
          cmake -S apps/mcux_freertos_blinky -B build-freertos-rtt -G Ninja \
            -DMCU_SDK_PATH="$PWD/.deps/mcux-sdk" \
            -DLOG_BACKEND=RTT \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-freertos-rtt

      - name: Build WiFi USB CDC
        run: |
          cmake -S apps/mcux_freertos_wifi -B build-freertos-wifi -G Ninja \
            -DMCU_SDK_PATH="$PWD/.deps/mcux-sdk" \
            -DLOG_BACKEND=USB \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-freertos-wifi

      - name: Build WiFi SEGGER RTT
        run: |
          cmake -S apps/mcux_freertos_wifi -B build-freertos-wifi-rtt -G Ninja \
            -DMCU_SDK_PATH="$PWD/.deps/mcux-sdk" \
            -DLOG_BACKEND=RTT \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-freertos-wifi-rtt

      - name: Unity wb_log + gs1500m
        run: |
          ./scripts/fetch_unity.sh "$PWD/.deps/unity"
          cmake -S tests/unity -B build-unity -G Ninja -DUNITY_PATH="$PWD/.deps/unity"
          cmake --build build-unity
          ctest --test-dir build-unity --output-on-failure

      - name: Upload blinky USB ELF
        uses: actions/upload-artifact@v4
        with:
          name: freertos-blinky-usb
          path: |
            build-freertos/wunderbar_freertos_blinky.elf
            build-freertos/wunderbar_freertos_blinky.bin
            build-freertos/wunderbar_freertos_blinky.hex

      - name: Upload blinky RTT ELF
        uses: actions/upload-artifact@v4
        with:
          name: freertos-blinky-rtt
          path: |
            build-freertos-rtt/wunderbar_freertos_blinky.elf
            build-freertos-rtt/wunderbar_freertos_blinky.bin
            build-freertos-rtt/wunderbar_freertos_blinky.hex

      - name: Upload WiFi USB ELF
        uses: actions/upload-artifact@v4
        with:
          name: freertos-wifi-usb
          path: |
            build-freertos-wifi/wunderbar_freertos_wifi.elf
            build-freertos-wifi/wunderbar_freertos_wifi.bin
            build-freertos-wifi/wunderbar_freertos_wifi.hex

      - name: Upload WiFi RTT ELF
        uses: actions/upload-artifact@v4
        with:
          name: freertos-wifi-rtt
          path: |
            build-freertos-wifi-rtt/wunderbar_freertos_wifi.elf
            build-freertos-wifi-rtt/wunderbar_freertos_wifi.bin
            build-freertos-wifi-rtt/wunderbar_freertos_wifi.hex

  nrf51:
    name: nRF51 BT master + sensor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unzip

      - name: Fetch ARM GCC 10.3.1
        run: ./scripts/fetch_arm_gcc_10_3_1.sh "$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10"

      - name: Fetch nRF5 SDK 12.1.0
        run: ./scripts/fetch_nrf5_sdk.sh "$PWD/.deps/nRF5_SDK_12.1.0"

      - name: Build nRF51 BT master
        run: |
          export PATH="$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10/bin:$PATH"
          arm-none-eabi-gcc --version | head -1
          make -C apps/nrf51_bt_master \
            NRF5_SDK_ROOT="$PWD/.deps/nRF5_SDK_12.1.0" \
            GNU_INSTALL_ROOT="$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10/bin/"

      - name: Build nRF51 BT sensor
        run: |
          export PATH="$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10/bin:$PATH"
          make -C apps/nrf51_bt_sensor \
            NRF5_SDK_ROOT="$PWD/.deps/nRF5_SDK_12.1.0" \
            GNU_INSTALL_ROOT="$PWD/.deps/gcc-arm-none-eabi-10.3-2021.10/bin/"

      - name: Upload nRF51 ELF
        uses: actions/upload-artifact@v4
        with:
          name: nrf51-bt-master
          path: |
            apps/nrf51_bt_master/build/wb_nrf51_bt_master.out
            apps/nrf51_bt_master/build/wb_nrf51_bt_master.hex
            apps/nrf51_bt_master/build/wb_nrf51_bt_master.map

      - name: Upload nRF51 sensor ELF
        uses: actions/upload-artifact@v4
        with:
          name: nrf51-bt-sensor
          path: |
            apps/nrf51_bt_sensor/build/wb_nrf51_bt_sensor.out
            apps/nrf51_bt_sensor/build/wb_nrf51_bt_sensor.hex
            apps/nrf51_bt_sensor/build/wb_nrf51_bt_sensor.map
